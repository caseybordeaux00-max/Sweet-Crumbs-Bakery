name: Build Sweet Crumbs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          unzip -q SweetCrumbs-GitHub-ready.zip -d project

          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Could not find the Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            -Pkotlin.jvm.target.validation.mode=warning \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not produced."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/SweetCrumbs-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetCrumbs-debug-apk
          path: apk-output/SweetCrumbs-debug.apk
          if-no-files-found: error
