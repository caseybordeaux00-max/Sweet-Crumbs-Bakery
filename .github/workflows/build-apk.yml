name: Build Sweet Crumbs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q SweetCrumbs-GitHub-ready.zip -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name gradlew -type f | head -n 1)")" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -name "*-debug.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK was not produced."
            exit 1
          fi
          mkdir -p apk-output
          cp "$APK" apk-output/SweetCrumbs-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetCrumbs-debug-apk
          path: apk-output/SweetCrumbs-debug.apk
